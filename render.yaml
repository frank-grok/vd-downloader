services:
  - type: web
    name: vd-downloader
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --timeout 600 --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # DL_TOKEN: public URL မို့ token ထားတာ ပိုလုံခြုံတယ်.
      # Render dashboard → Environment → Add: DL_TOKEN = <ကိုယ်ကြိုက်တဲ့ စကားဝှက်>
      - key: DL_TOKEN
        value: ""
      # 解析 API chain — ကော်မာနဲ့ ခြား, တစ်ခုသေရင် နောက်တစ်ခုစမ်း
      - key: PARSE_APIS
        value: https://qsy.aiwyuw.cn/api/short_videos.php?url=,https://www.yhqsj.cn/api/short_videos.php?url=
      # YouTube bot-check အသေချာဆုံးရှောင်နည်း (optional):
      # Chrome "Get cookies.txt LOCALLY" extension နဲ့ youtube.com cookies ထုတ်
      # → ဒီ env ရဲ့ value မှာ အဲ့ဖိုင်ထဲက စာသားအကုန် ကပ်
      - key: YTDLP_COOKIES
        value: ""
      - key: MAX_MB
        value: "500"
